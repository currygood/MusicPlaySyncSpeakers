# ============================================================
# 外部组件依赖（当前阶段暂不启用）
# ------------------------------------------------------------
# 注意：以下组件用于后续阶段（UI/LVGL、蓝牙音频、SD 卡、音频解码），
# 本阶段代码没有引用它们。启用时需要联网访问 espressif 组件仓库，
# 否则 cmake 配置会因无法连接组件注册中心而失败。
# 需要时取消注释，并执行 idf.py set-target esp32s3 后重新构建。
# ============================================================
dependencies:
  lvgl/lvgl: "^9"
  espressif/esp_lvgl_port: "^2"
  espressif/cjson: "^1.7.19"